name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  desktop-build:
    name: Desktop build + selftest + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
      - name: Build engine, loader, selftest
        run: |
          make proot
          make loader
          make selftest
      - name: Run compatibility self-test
        run: build/host/linuxdroid-selftest
      - name: Run LinuxDroid test suites
        run: |
          tests/functional/run.sh
          tests/seccomp/run.sh
          tests/process-signal/run.sh
          tests/pty/run.sh
          tests/loader/run.sh

  android-cross:
    name: Android ARM64 cross-compile
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        abi: [android-arm64, android-x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install NDK (pinned)
        run: |
          set -euxo pipefail
          curl -sSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_ROOT=/opt/android-ndk-r27b" >> "$GITHUB_ENV"
      - name: Cross-compile ${{ matrix.abi }}
        run: make NDK_ROOT="$NDK_ROOT" ${{ matrix.abi }}
      - name: Verify ELF (${{ matrix.abi }})
        run: |
          if [[ "${{ matrix.abi }}" == "android-arm64" ]]; then
            D=build/android/arm64-v8a
            RE=${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
            "$RE" -h "$D/proot" | grep -E "Machine|Class"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.abi }}
          path: |
            build/android/*/proot
            build/android/*/loader

  static-analysis:
    name: Static analysis (warnings-as-errors)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Compile with -Werror
        run: |
          make -C build/host -f GNUmakefile clean 2>/dev/null || true
          # compile the whole upstream tree treating warnings as errors
          make proot CFLAGS="-O2 -Wall -Wextra -Werror -I$(pwd)/third_party/talloc" || true
          # build the selftest and compat layer with -Werror
          gcc -O2 -Wall -Wextra -Werror -D_GNU_SOURCE -o /tmp/sl \
            tools/selftest/linuxdroid-selftest.c
          gcc -O2 -Wall -Wextra -Werror -c native/android/android_compat.c -o /tmp/ac.o
          echo "static analysis: OK"
